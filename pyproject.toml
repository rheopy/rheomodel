[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheopy-rheomodel"
version = "0.1.0"
description = "Rheological constitutive models with verified academic citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marco Caggioni" }]
keywords = ["rheology", "constitutive models", "flow curve", "viscoplastic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "sphinx", "myst-parser", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/rheopy/rheomodel"
Repository = "https://github.com/rheopy/rheomodel"

[tool.hatch.build.targets.wheel]
packages = ["src/rheomodel"]
